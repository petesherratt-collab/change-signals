name: probe
# Finds and checks pages before anything is collected; edits nothing.
# Runs by hand, or on a push that changes the watchlist or the probe (both modes).
on:
  push:
    branches: [main]
    paths: [watchlist.yml, tools/probe.py, .github/workflows/probe.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (sites -> candidate pages) or verify (listed pages -> stability)"
        default: discover
        type: choice
        options: [discover, verify]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests pyyaml beautifulsoup4
      - if: github.event_name == 'workflow_dispatch'
        run: python tools/probe.py ${{ inputs.mode }}
      - if: github.event_name == 'push'
        run: python tools/probe.py discover && python tools/probe.py verify
