# Not admitted after discovery (22 Nov 2026):
#   Mitchells & Butlers: www.mbplc.com answers 403 to the archive's agent.
#   Watches of Switzerland: corporate site answers 403; the shop site has no
#     careers, board or news pages.
#   Mulberry: corporate site fails TLS; the shop redirects a US runner to /us/.
#   Crest Nicholson: no corporate site reachable (plc domain fails TLS); only
#     the consumer news page is a candidate.
# Runner geography matters: Actions runs in the US, and a site that
# redirects by country would be archived as its US version.

