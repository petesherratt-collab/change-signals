# Change-signals watchlist: 25 smaller UK-listed, consumer-facing companies.
#
# Chosen for pages that change quietly and that analysts rarely watch
# (careers, board, news), across pubs and food, leisure, home and DIY,
# specialist retail, online retail and housebuilding.
#
# STATUS: sites UNVERIFIED. Domains were written from memory and have not been
# fetched; `pages` are empty until tools/probe.py has run from the collection
# host, checked robots.txt and redirects, and found the careers, board and news
# pages. Each page is added only once its selector is byte-stable across two
# fetches. A company that cannot be stabilised is dropped and the reason noted.
#
# `ticker` is the Yahoo Finance symbol used for scoring; `benchmark` is the
# index the excess return is measured against.

